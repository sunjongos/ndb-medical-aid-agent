name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m agent eval
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ndb-medical-aid-agent .
      - run: docker run --rm -v $PWD/examples:/app/examples -v $PWD/output:/app/output ndb-medical-aid-agent run --patient examples/patient_spine.json --encounter examples/encounter_spine.json --out output/ci
